<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="A moon-guided journaling app with tarot card inspired advisors, designed to help you reflect, organise your thoughts, and build a consistent writing practice."/>
    <title>Contact | Celestialog</title>
    <!-- Favicon - generated with favicon.io -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    <!-- Custom css -->
    <link rel="stylesheet" href="assets/css/style.css"/>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav id="nav" aria-label="Primary navigation">
      <img src="assets/images/moon/waning-crescent-symbol.svg" alt="Celestialog moon icon"/>
      <ul>
        <li>
          <a href="index.html">Home</a>
        </li>
        <li>
          <a href="journal.html">Journal</a>
        </li>
        <li>
          <a href="contact.html" aria-current="page" class="active">Contact</a>
        </li>
      </ul>
    </nav>
    <!-- MAIN CONTACT section -->
    <main>
      <div class="section-wrapper error404 contact">
        <div class="section-container error404 contact">
          <div class="heading-container">
            <div class="landing-img-container">
              <img src="assets/images/moon/first-quarter.webp" alt="Illustration of the moon" class="landing-img"/>
            </div>
            <!-- Contact form -->
            <h1 class="h2">Contact</h1>
            <form action="success.html" method="GET" class="form-container">
              <div class="form-section">
                <label for="name">Name</label>
                <input id="name" type="text" name="name" autocomplete="name" required>
              </div>
              <div class="form-section">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" autocomplete="email" required>
              </div>
              <div class="form-section">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="8" placeholder="Enter your message" required></textarea>
              </div>
              <button type="submit" class="main-cta">Submit</button>
            </form>
          </div>
        </div>
      </div>
      <div class="bottom-gradient"></div>
    </main>
    <!-- DEV INFO -->
    <footer class="website-info">
      <p>© celestialog 2026 | Built by <a href="https://github.com/SADGHOBLIN" target="_blank" rel="noopener noreferrer" aria-label="View SADGHOBLIN's GitHub profile">SADGHOBLIN</a></p>
    </footer>
  </body>
</html>
