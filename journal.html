<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: -->
    <!-- meta description -->
    <!-- meta keywords -->
    <title>Journal | Celestialog</title>
    <!-- favicon -->
    <!-- CSS: bootstrap / custom -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
     <div id="nav" class="wireframe">
      <ul>
        <li>
            <a href="index.html">Home</a>
        </li>
        <li>
            <a href="journal.html">Journal</a>
        </li>
      </ul>
     </div>

    <!-- Journal section -->
     <div class="section-wrapper journal-pg wireframe">
      <div class="section-container journal-pg wireframe">

        <!-- Persona Cards -->
        <div class="personas wireframe">
          
            <div class="persona-title">
                The Watcher
            </div>
            <div class="persona-cards">
                <!-- TODO: ability to swipe through personas to "select" -->
                advisor image
            </div>
            <div class="moon-info">
                <!-- TODO: store moon info to be injected as custom data -->
                 <p>moon illustration</p>
                 <p id="moon-phase-data"></p>
                 <p id="current-date-data"></p>
                 <p id="moon-visibility-data"></p>
            </div>

        </div>

        <!-- Note entries -->
         <div class="journal-app">

          <div class="options-header">
            <button id="use-journal">Use Journal</button>
            <button id="use-advisor">Talk to Advisor</button>
          </div>

          <!-- Journal pages -->
            <div id="journal" class="journal-container">
              <div class="journal-wrapper">

                <form id="note-form">
                  <div class="note-header">
                      <div class="title-container">
                      <label for="note-title"></label>
                      <input id="note-title" type="text" placeholder="Journal Title">
                      <p id="note-date">Date:</p>
                    </div>

                    <div class="moon-container">
                      <p id="note-moon"></p>
                    </div>
                  </div>

                  <textarea 
                    name="note-content" 
                    id="note-content"
                    placeholder="Begin your writing..."
                    required
                    ></textarea>
                  
                  <div class="note-footer">
                    <button id="save-note">Save note</button>
                  </div>
                </form>

              </div>
            </div>

            <!-- Advisor chat -->
            <div id="advisor" class="advisor-container hidden">
              <div class="chat-wrapper">

                <div class="chat-header">
                  <p>Advisor Name</p>
                </div>

                <div id="chat-body">
                  <div class="advisor-msg first-msg">Hello, I will await your presence. Please consult me when you are ready...</div>
                </div>

                <div class="user-input-box">
                  <input id="user-msg-input" type="text" placeholder="Input message..." autocomplete="off">
                  <button id="send-msg-btn">Send</button>
                </div>
              </div>

            </div>

         </div>


        
      </div>
     </div>

     <!-- Narrative About section -->
      <div class="section-wrapper wireframe">
        <div class="section-container wireframe">
          2nd section
        </div>
      </div>

    <!-- Custom JavaScript -->
    <script src="assets/js/script.js" type="module"></script>
  </body>
</html>
