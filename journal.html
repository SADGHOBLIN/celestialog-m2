<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: -->
    <!-- meta description -->
    <!-- meta keywords -->
    <title>Journal | Celestialog</title>
    <!-- favicon -->
    <!-- CSS: bootstrap / custom -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <div id="nav">
      <ul>
        <li>
          <a href="index.html">Home</a>
        </li>
        <li>
          <a href="journal.html">Journal</a>
        </li>
      </ul>
    </div>

    <!-- Journal app window -->
     <div class="section-wrapper journal-pg wireframe">
      <div class="section-container journal-pg wireframe">

        <div id="note-editor" data-note-id="" class="col-2">
          <!-- note editor heading section -->
          <div class="note-editor-container">
            <div class="note-header">
              <div class="title-container">
                <label for="note-title"></label>
                <input id="note-title" type="text" placeholder="Journal Title" autocomplete="off">
                <p id="note-date"></p>
              </div>

              <div class="moon-container">
                <img
                  src="assets/images/moon-placeholder.png"
                  alt="a full moon"
                  class="moon-img-placeholder"
                />
                <p id="note-moon"></p>
              </div>
            </div>
            <!-- note editor input section -->
            <textarea
              name="note-content"
              id="note-content"
              placeholder="Begin your writing..."
              required
            ></textarea>
          </div>
        </div>

        <!-- note editor buttons, col-1 -->
        <div class="note-buttons col-1">
          <button id="save-note" type="submit" class="btn-cta">
            <span class="material-symbols-outlined">save_as</span><br>
            save
          </button>

          <button id="create-note" class="btn-small">
            <span class="material-symbols-outlined">new_window</span><br>
            new
          </button>

          <button id="view-notes" class="btn-small">
            <span class="material-symbols-outlined">folder_open</span><br>
            open
          </button>

          <button id="view-recycle-bin" class="btn-small">
            <span class="material-symbols-outlined">delete</span><br>
            bin
          </button>
          <!-- Debugging - remove later -->
          <!-- <button id="clear-notes">Delete all notes</button> -->
        </div>

        <!-- advisor personas section, col-3 -->
         <div id="personas" class="col-3">

          <div class="persona-title wireframe">
            The Watcher
          </div>

          <div class="persona-cards wireframe">
            <!-- TODO: ability to swipe through personas to "select" -->
             <div id="deck" class="deck--idle">
              <div class="card card-left card-in-deck" data-advisor-name="alchemist">
                <button class="card-hitbox" aria-label="Select 'The Alchemist' card"></button>
                <img src="assets/images/moon-placeholder.png" alt="" class="card-visual">
              </div>
              <div class="card card-center card-in-deck" data-advisor-name="watcher">
                <button class="card-hitbox" aria-label="Select 'The Watcher' card"></button>
                <img src="assets/images/moon-placeholder.png" alt="" class="card-visual">
              </div>
              <div class="card card-right card-in-deck" data-advisor-name="logician">
                <button class="card-hitbox" aria-label="Select 'The Logician' card"></button>
                <img src="assets/images/moon-placeholder.png" alt="" class="card-visual">
              </div>
            </div>
            <p class="deck__instruction">Select an advisor</p>
          </div>

          <div class="moon-info wireframe">
            <!-- TODO: store moon info to be injected as custom data -->
            <p>moon illustration</p>
            <p id="moon-phase-data"></p>
            <p id="current-date-data"></p>
            <p id="moon-visibility-data"></p>
          </div>

         </div>

      </div>
    </div>

    <!-- TODO: advisor chat window -->
    <div id="advisor" class="advisor-container hidden">
      <div class="chat-wrapper">

        <div class="chat-header">
          <p>Advisor Name</p>
        </div>

        <div id="chat-body">
          <div class="advisor-msg first-msg">
            Hello, I will await your presence. Please consult me when you are ready...
          </div>
        </div>

        <div class="user-input-box">
          <input
            id="user-msg-input"
            type="text"
            placeholder="Input message..."
            autocomplete="off"
          />
          <button id="send-msg-btn">Send</button>
        </div>

      </div>
    </div>

    <!-- Toggle windows -->
    <div class="options-header wireframe">
      <button id="use-journal" class="big-btn">Use Journal</button>
      <button id="use-advisor" class="big-btn">Talk to Advisor</button>
    </div>

    <!-- Narrative About section -->
    <div class="section-wrapper">
      <div class="section-container">2nd section</div>
    </div>

    <!-- View notes modal -->
    <div id="notes-container-modal" class="modal-overlay">
      <div id="modal-element" class="modal">

        <div class="modal-header">
          <h3 id="modal-title">Title</h3>
        </div>

        <div id="modal-body"></div>

        <div id="modal-footer">
          <button id="close-modal">Close Modal</button>
        </div>

      </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="assets/js/script.js" type="module"></script>
  </body>
</html>
